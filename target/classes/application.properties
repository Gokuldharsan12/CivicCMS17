# ── Server ─────────────────────────────────────────────────────────
server.port=8080
spring.main.allow-circular-references=true

# ── MySQL Database ──────────────────────────────────────────────────
# Set these environment variables before running the app:
#
#   export DB_HOST=localhost
#   export DB_PORT=3306
#   export DB_NAME=civic_cms
#   export DB_USERNAME=root
#   export DB_PASSWORD=your_mysql_password
#
# Or create a .env file and run:   source .env && mvn spring-boot:run
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:civic_cms}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:deepak@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── SQL Init (seed departments only) ───────────────────────────────
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# ── File Upload ─────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# ── Email (Gmail SMTP) ──────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:noreply@civiccms.in}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.test-connection=false

# ── JWT ─────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyForCivicCMSProjectThatIsAtLeast256BitsLong2026}
jwt.expiration=86400000

# ── Chaos Detection Thresholds ──────────────────────────────────────
chaos.warning.threshold=5
chaos.critical.threshold=15
chaos.zone.radius.degrees=0.005

# ── OTP Config ──────────────────────────────────────────────────────
app.otp.use-email-fallback=true

# ── AI / Anthropic ─────────────────────────────────────────────────
anthropic.api.key=${ANTHROPIC_API_KEY:}

# ── Logging ─────────────────────────────────────────────────────────
logging.level.com.civiccms=INFO
logging.level.org.springframework.security=WARN

# ── Fast2SMS ────────────────────────────────────────────────────────
fast2sms.api.key=${FAST2SMS_API_KEY:}
app.otp.daily.limit=10
