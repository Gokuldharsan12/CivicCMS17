<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var t=localStorage.getItem('civicTheme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Editor — CivicCMS Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/animations.css">
  <style>
    /* ── Layout ── */
    .ce-wrap   { display:grid; grid-template-columns:260px 1fr; gap:0; min-height:calc(100vh - 60px); }
    .ce-sidebar{ background:var(--surface); border-right:1px solid var(--border); padding:20px 0; position:sticky; top:60px; height:calc(100vh - 60px); overflow-y:auto; }
    .ce-main   { padding:28px 32px; overflow-y:auto; }

    /* ── Sidebar nav ── */
    .sb-title  { font-size:.65rem; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); padding:0 18px 8px; }
    .sb-item   { display:flex; align-items:center; gap:10px; padding:9px 18px; cursor:pointer; font-size:.84rem; font-weight:600; color:var(--text-muted); border-left:3px solid transparent; transition:all .15s; }
    .sb-item:hover  { background:var(--surface2); color:var(--text); }
    .sb-item.active { background:var(--indigo-lt,#EEF2FF); color:var(--indigo); border-left-color:var(--indigo); }
    .sb-item .sb-icon { font-size:1.1rem; width:22px; text-align:center; }
    .sb-badge  { margin-left:auto; background:var(--surface2); border:1px solid var(--border); border-radius:10px; font-size:.65rem; font-weight:700; padding:1px 7px; color:var(--text-dim); }

    /* ── Page header ── */
    .ce-page-title { font-family:var(--font-head); font-size:1.4rem; font-weight:900; margin-bottom:4px; }
    .ce-page-sub   { font-size:.82rem; color:var(--text-muted); margin-bottom:24px; }

    /* ── Content cards ── */
    .content-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:18px; }
    .content-card { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-xl); overflow:hidden; transition:box-shadow .2s; }
    .content-card:hover { box-shadow:var(--shadow-md); }
    .cc-head { padding:13px 16px; background:var(--surface2); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }
    .cc-type-badge { font-size:.6rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; padding:2px 7px; border-radius:8px; }
    .cc-type-TEXT  { background:#EEF2FF; color:var(--indigo); }
    .cc-type-IMAGE { background:#F0FDF4; color:#16a34a; }
    .cc-key  { font-family:var(--font-mono,monospace); font-size:.72rem; color:var(--text-muted); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cc-label{ font-size:.82rem; font-weight:700; color:var(--text); }
    .cc-body { padding:14px 16px; }

    /* ── Preview ── */
    .preview-text  { font-size:.88rem; color:var(--text-muted); background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); padding:8px 10px; min-height:36px; margin-bottom:10px; word-break:break-word; }
    .preview-img   { width:100%; max-height:140px; object-fit:cover; border-radius:var(--radius); border:1px solid var(--border); margin-bottom:10px; background:var(--surface2); display:block; }
    .preview-img-placeholder { width:100%; height:90px; display:flex; align-items:center; justify-content:center; background:var(--surface2); border:2px dashed var(--border); border-radius:var(--radius); color:var(--text-dim); font-size:.8rem; margin-bottom:10px; }

    /* ── Edit controls ── */
    .edit-row    { display:flex; gap:8px; align-items:flex-start; flex-wrap:wrap; }
    .edit-input  { flex:1; min-width:0; }
    textarea.edit-input { resize:vertical; min-height:60px; }
    .btn-save    { background:var(--indigo); color:#fff; border:none; padding:8px 16px; border-radius:var(--radius); font-size:.8rem; font-weight:700; cursor:pointer; white-space:nowrap; transition:opacity .15s; }
    .btn-save:hover { opacity:.85; }
    .btn-save:disabled { opacity:.5; cursor:not-allowed; }
    .btn-upload  { background:#16a34a; color:#fff; border:none; padding:8px 14px; border-radius:var(--radius); font-size:.8rem; font-weight:700; cursor:pointer; white-space:nowrap; transition:opacity .15s; }
    .btn-upload:hover { opacity:.85; }
    .upload-input{ display:none; }
    .save-status { font-size:.72rem; margin-top:5px; font-weight:600; }
    .save-status.ok  { color:#16a34a; }
    .save-status.err { color:#dc2626; }

    /* ── Add new content ── */
    .add-section { background:var(--surface); border:1.5px dashed var(--border); border-radius:var(--radius-xl); padding:22px; margin-bottom:26px; }
    .add-section h3 { font-family:var(--font-head); font-size:.95rem; font-weight:800; margin-bottom:14px; color:var(--text-muted); }
    .add-grid { display:grid; grid-template-columns:1fr 1fr 1fr 1fr auto; gap:10px; align-items:end; }
    @media(max-width:900px){ .add-grid{ grid-template-columns:1fr 1fr; } .ce-wrap{ grid-template-columns:1fr; } .ce-sidebar{ position:static; height:auto; } }

    /* ── Toast ── */
    .toast-area { position:fixed; bottom:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:8px; }
    .toast-msg  { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:12px 18px; box-shadow:var(--shadow-lg); font-size:.83rem; font-weight:600; animation:toastIn .3s ease; min-width:220px; }
    .toast-msg.ok  { border-left:4px solid #16a34a; color:#16a34a; }
    .toast-msg.err { border-left:4px solid #dc2626; color:#dc2626; }
    @keyframes toastIn { from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;} }

    /* ── Empty state ── */
    .empty-state { text-align:center; padding:60px 20px; color:var(--text-dim); }
    .empty-state .es-icon { font-size:3rem; margin-bottom:12px; }

    /* ── Loading ── */
    .skeleton-card { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-xl); height:180px; animation:pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">
    <div class="brand-icon">C</div>
    <span><span class="brand-accent">Civic</span>CMS <span style="font-size:.7rem;color:var(--text-muted);font-weight:500;">Admin</span></span>
  </div>
  <div class="navbar-links">
    <a href="/admin/dashboard.html">Dashboard</a>
    <a href="/admin/complaints.html">Complaints</a>
    <a href="/admin/dept-heads.html">🏢 Dept Heads</a>
    <a href="/admin/alerts.html">🚨 Alerts</a>
    <a href="/admin/content-editor.html" class="active">✏️ Content</a>
    <a href="/admin/heatmap.html">Heatmap</a>
    <button class="btn btn-sm btn-outline" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="ce-wrap">

  <!-- ── Sidebar ── -->
  <aside class="ce-sidebar" id="sidebar">
    <div class="sb-title">Pages</div>
    <!-- populated by JS -->
  </aside>

  <!-- ── Main panel ── -->
  <main class="ce-main">

    <!-- Add new content entry -->
    <div class="add-section">
      <h3>➕ Add New Content Entry</h3>
      <div class="add-grid">
        <div>
          <label class="form-label">Page</label>
          <input id="new-page" class="form-control" placeholder="index, login, global …">
        </div>
        <div>
          <label class="form-label">Key</label>
          <input id="new-key" class="form-control" placeholder="hero.headline">
        </div>
        <div>
          <label class="form-label">Label (admin display)</label>
          <input id="new-label" class="form-control" placeholder="Hero Headline">
        </div>
        <div>
          <label class="form-label">Type</label>
          <select id="new-type" class="form-control">
            <option value="TEXT">Text / HTML</option>
            <option value="IMAGE">Image</option>
          </select>
        </div>
        <div style="padding-top:22px;">
          <button class="btn btn-primary" onclick="addEntry()">Add</button>
        </div>
      </div>
      <div style="margin-top:10px;">
        <label class="form-label">Default Value</label>
        <input id="new-value" class="form-control" placeholder="Enter default text, or leave blank for image entries">
      </div>
    </div>

    <!-- Page title + grid -->
    <div id="ce-page-title-area">
      <div class="ce-page-title">📄 All Content</div>
      <div class="ce-page-sub">Select a page from the sidebar to filter, or edit any entry below.</div>
    </div>
    <div class="content-grid" id="content-grid">
      <!-- skeleton placeholders while loading -->
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>

  </main>
</div>

<div class="toast-area" id="toast-area"></div>

<script src="/js/api.js"></script>
<script>
// ── State ──────────────────────────────────────────────────────────
let allContent = [];     // flat array of SiteContent objects from /api/content/all
let activePage = null;   // currently selected page in sidebar (null = show all)

// ── Auth guard ─────────────────────────────────────────────────────
(function() {
  const token = localStorage.getItem('authToken') || sessionStorage.getItem('authToken');
  if (!token) { window.location.href = '/admin/login.html'; return; }
})();

function authHeaders() {
  const t = localStorage.getItem('authToken') || sessionStorage.getItem('authToken') || '';
  return { 'Authorization': 'Bearer ' + t, 'Content-Type': 'application/json' };
}

function logout() { API.clearSession(); window.location.href = '/admin/login.html'; }

// ── Bootstrap ──────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', loadAll);

async function loadAll() {
  try {
    const res = await fetch('/api/content/all', { headers: authHeaders() });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    allContent = await res.json();
    buildSidebar();
    renderGrid(null);
  } catch (e) {
    document.getElementById('content-grid').innerHTML =
      '<div class="empty-state"><div class="es-icon">⚠️</div><p>' + e.message + '</p></div>';
  }
}

// ── Sidebar ────────────────────────────────────────────────────────
function buildSidebar() {
  const pages = ['(All)', ...new Set(allContent.map(c => c.page))].sort((a,b) => a==='(All)'?-1:a.localeCompare(b));
  const sidebar = document.getElementById('sidebar');
  const icons = { index:'🏠', login:'🔐', register:'📝', submit:'📨', track:'🔍',
                  history:'📋', chatbot:'🤖', feedback:'⭐', admin:'🛡️', global:'🌐', dept:'🏢' };
  sidebar.innerHTML = '<div class="sb-title">Pages</div>' +
    pages.map(p => {
      const key = p === '(All)' ? null : p;
      const cnt = key ? allContent.filter(c => c.page === key).length : allContent.length;
      const icon = icons[p] || '📄';
      return `<div class="sb-item ${activePage === key ? 'active' : ''}" onclick="selectPage(${JSON.stringify(key)})">
        <span class="sb-icon">${icon}</span>
        <span>${p}</span>
        <span class="sb-badge">${cnt}</span>
      </div>`;
    }).join('');
}

function selectPage(page) {
  activePage = page;
  buildSidebar();
  renderGrid(page);
  const area = document.getElementById('ce-page-title-area');
  area.innerHTML = page
    ? `<div class="ce-page-title">📄 ${page}</div><div class="ce-page-sub">${allContent.filter(c=>c.page===page).length} content entries for this page.</div>`
    : `<div class="ce-page-title">📄 All Content</div><div class="ce-page-sub">${allContent.length} total entries across all pages.</div>`;
}

// ── Grid renderer ──────────────────────────────────────────────────
function renderGrid(page) {
  const items = page ? allContent.filter(c => c.page === page) : allContent;
  const grid = document.getElementById('content-grid');

  if (!items.length) {
    grid.innerHTML = '<div class="empty-state"><div class="es-icon">🗂️</div><p>No content entries yet. Add one above!</p></div>';
    return;
  }

  grid.innerHTML = items.map(item => buildCard(item)).join('');
}

function buildCard(item) {
  const isImg = item.contentType === 'IMAGE';
  const preview = isImg
    ? (item.value
        ? `<img class="preview-img" src="${item.value}" alt="${item.label||item.contentKey}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
           <div class="preview-img-placeholder" style="display:none;">📷 Image not found</div>`
        : `<div class="preview-img-placeholder">📷 No image yet</div>`)
    : `<div class="preview-text">${item.value ? escHtml(item.value) : '<em style="color:var(--text-dim)">Empty</em>'}</div>`;

  const controls = isImg
    ? `<div class="edit-row">
         <label class="btn-upload" style="cursor:pointer;">
           📷 Upload New Image
           <input type="file" class="upload-input" accept="image/*"
                  onchange="uploadImage(event, ${item.id}, '${esc(item.page)}', '${esc(item.contentKey)}', '${esc(item.label||'')}')">
         </label>
         <input class="form-control edit-input" placeholder="Or paste image URL"
                id="url-${item.id}" value="${esc(item.value||'')}">
         <button class="btn-save" onclick="saveUrl(${item.id}, '${esc(item.page)}', '${esc(item.contentKey)}', '${esc(item.label||'')}')">Save URL</button>
       </div>`
    : `<div class="edit-row">
         <textarea class="form-control edit-input" id="txt-${item.id}" rows="2">${escHtml(item.value||'')}</textarea>
         <button class="btn-save" onclick="saveText(${item.id}, '${esc(item.page)}', '${esc(item.contentKey)}', '${esc(item.label||'')}')">Save</button>
       </div>`;

  return `
  <div class="content-card" id="card-${item.id}">
    <div class="cc-head">
      <span class="cc-type-badge cc-type-${item.contentType}">${item.contentType}</span>
      <span class="cc-key" title="${escHtml(item.page + ' / ' + item.contentKey)}">${escHtml(item.page)} / ${escHtml(item.contentKey)}</span>
      <button onclick="deleteEntry(${item.id})" title="Delete" style="background:none;border:none;cursor:pointer;color:var(--text-dim);font-size:.85rem;padding:0 2px;">🗑️</button>
    </div>
    <div class="cc-body">
      <div class="cc-label">${escHtml(item.label || item.contentKey)}</div>
      <div style="height:8px;"></div>
      ${preview}
      ${controls}
      <div class="save-status" id="status-${item.id}"></div>
    </div>
  </div>`;
}

// ── Save text ──────────────────────────────────────────────────────
async function saveText(id, page, key, label) {
  const el = document.getElementById('txt-' + id);
  const btn = el.closest('.edit-row').querySelector('.btn-save');
  const status = document.getElementById('status-' + id);
  const value = el.value;
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const res = await fetch('/api/content', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ page, contentKey: key, value, label })
    });
    if (!res.ok) throw new Error(await res.text());
    const updated = await res.json();
    // Update local state
    const idx = allContent.findIndex(c => c.id === id);
    if (idx >= 0) allContent[idx] = updated; else allContent.push(updated);
    status.textContent = '✅ Saved'; status.className = 'save-status ok';
    toast('✅ Saved: ' + label, 'ok');
    // Refresh preview text in card
    const card = document.getElementById('card-' + id);
    const preview = card.querySelector('.preview-text');
    if (preview) preview.innerHTML = value ? escHtml(value) : '<em style="color:var(--text-dim)">Empty</em>';
  } catch(e) {
    status.textContent = '❌ ' + e.message; status.className = 'save-status err';
    toast('❌ Save failed: ' + e.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = 'Save';
    setTimeout(() => { status.textContent = ''; }, 4000);
  }
}

// ── Save URL for image ─────────────────────────────────────────────
async function saveUrl(id, page, key, label) {
  const el   = document.getElementById('url-' + id);
  const btn  = el.closest('.edit-row').querySelector('.btn-save');
  const status = document.getElementById('status-' + id);
  const value = el.value.trim();
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const res = await fetch('/api/content', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ page, contentKey: key, value, label })
    });
    if (!res.ok) throw new Error(await res.text());
    const updated = await res.json();
    const idx = allContent.findIndex(c => c.id === id);
    if (idx >= 0) allContent[idx] = updated;
    // Update preview image
    const card = document.getElementById('card-' + id);
    const img = card.querySelector('.preview-img');
    if (img) { img.src = value; img.style.display = 'block'; }
    status.textContent = '✅ Saved'; status.className = 'save-status ok';
    toast('✅ Image URL saved', 'ok');
  } catch(e) {
    status.textContent = '❌ ' + e.message; status.className = 'save-status err';
    toast('❌ ' + e.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = 'Save URL';
    setTimeout(() => { status.textContent = ''; }, 4000);
  }
}

// ── Upload image file ──────────────────────────────────────────────
async function uploadImage(event, id, page, key, label) {
  const file = event.target.files[0];
  if (!file) return;
  const status = document.getElementById('status-' + id);
  status.textContent = '⏳ Uploading…'; status.className = 'save-status';

  const form = new FormData();
  form.append('page', page);
  form.append('contentKey', key);
  form.append('label', label);
  form.append('file', file);

  try {
    const token = localStorage.getItem('authToken') || sessionStorage.getItem('authToken') || '';
    const res = await fetch('/api/content/image', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token },
      body: form
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();

    // Update local state
    const idx = allContent.findIndex(c => c.id === id);
    if (idx >= 0) allContent[idx].value = data.url;

    // Update preview image in card
    const card = document.getElementById('card-' + id);
    const img = card.querySelector('.preview-img');
    const urlInput = document.getElementById('url-' + id);
    if (urlInput) urlInput.value = data.url;
    if (img) { img.src = data.url + '?t=' + Date.now(); img.style.display = 'block'; }
    else {
      const ph = card.querySelector('.preview-img-placeholder');
      if (ph) {
        const newImg = document.createElement('img');
        newImg.className = 'preview-img';
        newImg.src = data.url;
        ph.replaceWith(newImg);
      }
    }
    status.textContent = '✅ Uploaded'; status.className = 'save-status ok';
    toast('✅ Image uploaded successfully', 'ok');
  } catch(e) {
    status.textContent = '❌ ' + e.message; status.className = 'save-status err';
    toast('❌ Upload failed: ' + e.message, 'err');
  } finally {
    setTimeout(() => { status.textContent = ''; }, 4000);
  }
}

// ── Add new entry ──────────────────────────────────────────────────
async function addEntry() {
  const page  = document.getElementById('new-page').value.trim();
  const key   = document.getElementById('new-key').value.trim();
  const label = document.getElementById('new-label').value.trim();
  const type  = document.getElementById('new-type').value;
  const value = document.getElementById('new-value').value.trim();

  if (!page || !key) { toast('❌ Page and Key are required', 'err'); return; }

  try {
    const res = await fetch('/api/content', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ page, contentKey: key, value, label })
    });
    if (!res.ok) throw new Error(await res.text());
    const entry = await res.json();
    // If IMAGE type requested, update the type separately (text endpoint defaults to TEXT)
    // For IMAGE just add and the card will show upload controls
    if (type === 'IMAGE') {
      entry.contentType = 'IMAGE';
    }
    allContent.unshift(entry);
    buildSidebar();
    selectPage(activePage);
    // Clear form
    ['new-page','new-key','new-label','new-value'].forEach(id => document.getElementById(id).value = '');
    toast('✅ Entry added: ' + (label || key), 'ok');
  } catch(e) {
    toast('❌ ' + e.message, 'err');
  }
}

// ── Delete ─────────────────────────────────────────────────────────
async function deleteEntry(id) {
  if (!confirm('Delete this content entry? This cannot be undone.')) return;
  try {
    const res = await fetch('/api/content/' + id, { method: 'DELETE', headers: authHeaders() });
    if (!res.ok) throw new Error(await res.text());
    allContent = allContent.filter(c => c.id !== id);
    document.getElementById('card-' + id)?.remove();
    buildSidebar();
    toast('🗑️ Entry deleted', 'ok');
  } catch(e) {
    toast('❌ ' + e.message, 'err');
  }
}

// ── Toast ──────────────────────────────────────────────────────────
function toast(msg, type='ok') {
  const area = document.getElementById('toast-area');
  const el = document.createElement('div');
  el.className = 'toast-msg ' + type;
  el.textContent = msg;
  area.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ── Helpers ────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function esc(s) {
  return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"');
}
</script>
</body>
</html>
